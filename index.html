<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>در دست تعمیر | IranFreelancer</title>
    
    <!-- فونت وزیرمتن برای زیبایی تایپوگرافی فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

    <style>
        /* تنظیمات اصلی رنگ */
        :root {
            --white-cream: #FDFBF7;
            --dark-green: #1A4D2E;
            --bg-overlay: rgba(253, 251, 247, 0.85); /* پوشش شیری شفاف روی عکس */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
            background-color: var(--white-cream);
            direction: rtl;
        }

        /* کانتینر اصلی عکس */
        .maintenance-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('maintance.gif'); /* نام فایل GIF شما */
            background-size: cover;
            background-position: center 30%; /* تنظیم مرکزیت عکس به بالاتر از وسط */
            background-repeat: no-repeat;
        }

        /* لایه پوشش شیری برای دیده شدن بهتر متن */
        .overlay-bg {
            position: absolute;
            inset: 0;
            background: var(--bg-overlay);
            z-index: 1;
        }

        /* کانتینر متن‌ها */
        .content-box {
            position: absolute;
            top: 18%; /* فاصله از بالا (بالاتر از وسط) */
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 1200px;
            padding: 2rem;
        }

        /* انیمیشن متن */
        .fade-in-text {
            opacity: 0;
            animation: fadeUp 1.2s ease forwards;
            color: var(--dark-green);
        }

        .fade-in-text:nth-child(2) { animation-delay: 0.2s; }
        .fade-in-text:nth-child(3) { animation-delay: 0.4s; }
        .fade-in-text:nth-child(4) { animation-delay: 0.6s; }
        .fade-in-text:nth-child(5) { animation-delay: 0.8s; }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* استایل متن‌ها */
        .title-main {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .title-sub {
            font-size: 1.5rem;
            font-weight: 500;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .lang-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem 3rem;
            margin-top: 2.5rem;
            font-size: 1.4rem;
            font-weight: 400;
        }

        .lang-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .lang-item .label {
            font-size: 1rem;
            color: #4f6b5c;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .lang-item .text {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* انعطاف‌پذیری برای موبایل و تبلت (Responsive) */
        @media (max-width: 1024px) {
            .content-box { top: 15%; }
            .title-main { font-size: 3.5rem; }
            .title-sub { font-size: 1.3rem; }
            .lang-grid { gap: 1rem 2rem; font-size: 1.2rem; }
        }

        @media (max-width: 768px) {
            .content-box { top: 12%; padding: 1.5rem; }
            .title-main { font-size: 2.5rem; }
            .title-sub { font-size: 1.1rem; }
            .lang-grid {
                flex-direction: column;
                gap: 1rem;
                font-size: 1rem;
                margin-top: 1.5rem;
            }
            .maintenance-wrapper {
                background-position: center 20%; /* جابجایی عکس به بالا در موبایل */
            }
        }

        @media (max-width: 480px) {
            .content-box { top: 10%; padding: 1rem; }
            .title-main { font-size: 2rem; }
            .title-sub { font-size: 1rem; }
            .lang-grid { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="maintenance-wrapper">
        <!-- لایه کاور شیری رنگ برای خوانایی بهتر متن -->
        <div class="overlay-bg"></div>

        <div class="content-box">
            <!-- متن فارسی اصلی -->
            <h1 class="title-main fade-in-text">در دست تعمیر هستیم</h1>
            
            <!-- جمله خلاقانه و حرفه‌ای -->
            <p class="title-sub fade-in-text">
                در حال بهینه‌سازی و توسعه زیرساخت‌ها برای ارائه خدمات بهتر به شما هستیم.
            </p>

            <!-- گرید ۴ زبان -->
            <div class="lang-grid fade-in-text">
                <!-- انگلیسی -->
                <div class="lang-item">
                    <span class="label">English</span>
                    <span class="text">We're currently under maintenance. We'll be back shortly.</span>
                </div>
                <!-- چینی -->
                <div class="lang-item">
                    <span class="label">中文</span>
                    <span class="text">我们正在维护中。很快就会恢复。</span>
                </div>
                <!-- ژاپنی -->
                <div class="lang-item">
                    <span class="label">日本語</span>
                    <span class="text">ただいまメンテナンス中です。まもなく復旧いたします。</span>
                </div>
                <!-- روسی -->
                <div class="lang-item">
                    <span class="label">Русский</span>
                    <span class="text">В настоящее время проводятся технические работы. Скоро вернемся.</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
